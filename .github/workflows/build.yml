name: Build EXE
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller openpyxl
      - run: pyinstaller --onefile --console --name filter_wav_by_excel filter_wav_by_excel.py
      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: dist/*.exe
