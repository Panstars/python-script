name: Build EXE

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --console --name rename_files rename_files.py
      - uses: actions/upload-artifact@v4
        with:
          name: rename_files_exe
          path: dist/rename_files.exe
