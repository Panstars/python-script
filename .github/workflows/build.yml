name: Build EXE

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build rename_files
        run: pyinstaller --onefile --console --name rename_files rename_files.py
      - name: Build flatten_folder
        run: pyinstaller --onefile --console --name flatten_folder flatten_folder.py
      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: |
            dist/rename_files.exe
            dist/flatten_folder.exe
